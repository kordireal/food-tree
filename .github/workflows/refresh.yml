name: refresh
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -s "https://farcaster.xyz/~api/v2/user-thread-casts?castHashPrefix=0x3db99055&username=czar&limit=5" -o thread.json
      - run: node refresh.mjs
      - run: |
          git config user.name "refresh-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh live root-cast data" || echo "nothing to commit"
          git push
