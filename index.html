    const a=pos[e[0]],b=pos[e[1]];if(!a||!b)return;
    const x1=b.x+NW,y1=b.y+NH*0.28,x2=a.x,y2=a.y+NH*0.28;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.bezierCurveTo(x1+GAPX*0.6,y1,x2-GAPX*0.6,y2,x2,y2);ctx.stroke();
  });
  DATA.nodes.forEach(n=>{
    const p=pos[n.h];if(!p)return;
    const x=p.x,y=p.y-NH/2;
    const isSel=sel===n.h,isRoot=n.h===ROOT;
    ctx.save();
    if(isSel){ctx.shadowColor="rgba(245,158,11,.8)";ctx.shadowBlur=18;}
    rr(x,y,NW,NH,12);
    ctx.fillStyle=isRoot?"rgba(245,158,11,.16)":(isSel?"rgba(245,158,11,.10)":"rgba(22,27,34,.92)");ctx.fill();
    ctx.strokeStyle=isRoot||isSel?"#f59e0b":"rgba(48,54,61,.9)";
    ctx.lineWidth=isRoot||isSel?2:1;ctx.stroke();ctx.restore();
    const pf=imgs["p:"+n.h];
    ctx.save();ctx.beginPath();ctx.arc(x+20,y+20,13,0,7);ctx.clip();
    if(pf&&pf!=="err")ctx.drawImage(pf,x+7,y+7,26,26);
    else{ctx.fillStyle="#30363d";ctx.fillRect(x+7,y+7,26,26);}
    ctx.restore();
    const fi=imgs["f:"+n.h];
    if(fi&&fi!=="err"){rr(x+8,y+40,NW-16,52,8);ctx.save();ctx.clip();ctx.drawImage(fi,x+8,y+40,NW-16,52);ctx.restore();}
    else{rr(x+8,y+40,NW-16,52,8);ctx.fillStyle="#1a2129";ctx.fill();ctx.fillStyle="#8b949e";ctx.font="16px sans-serif";ctx.textAlign="center";ctx.fillText("🍽",x+NW/2,y+72);ctx.textAlign="left";}
    ctx.fillStyle=isRoot?"#f59e0b":"#e6edf3";ctx.font="600 10px ui-sans-serif,system-ui";ctx.textAlign="left";
    ctx.fillText((isRoot?"👑 ":"")+String(n.u||("fid "+n.fid)).slice(0,13),x+36,y+18);
    if(originMode){const o=originOf(n);if(o){ctx.font="11px sans-serif";ctx.fillStyle="#f59e0b";ctx.fillText(o.label.slice(0,12),x+8,y+NH-4);}}
    if(isRoot){ctx.fillStyle="#f59e0b";ctx.font="600 9px ui-sans-serif";ctx.fillText("THE FOOD CAST",x+8,y+NH-5);}
  });
  ctx.restore();
}
function nodeAt(px,py){
  const x=(px-view.x)/view.s,y=(py-view.y)/view.s;
  for(const n of DATA.nodes){const p=pos[n.h];if(!p)continue;if(x>=p.x&&x<=p.x+NW&&y>=p.y-NH/2&&y<=p.y+NH/2)return n;}
  return null;
}

// interaction
let drag=null,moved=0;
const touches=new Map();
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};moved=0;cv.classList.add("drag");cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  moved+=Math.abs(dx)+Math.abs(dy);
  view.x=drag.vx+dx;view.y=drag.vy+dy;draw();
});
cv.addEventListener("pointerup",e=>{
  cv.classList.remove("drag");
  if(drag&&moved<6){const n=nodeAt(e.clientX,e.clientY);n?select(n.h):close();}
  drag=null;
});
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.12:0.89;
  const nx=e.clientX,ny=e.clientY;
  const wx=(nx-view.x)/view.s,wy=(ny-view.y)/view.s;
  view.s=Math.min(4,Math.max(0.08,view.s*f));
  view.x=nx-wx*view.s;view.y=ny-wy*view.s;draw();
},{passive:false});
cv.addEventListener("touchmove",e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinch){
      const f=d/pinch.d;
      const mx=(e.touches[0].clientX+e.touches[1].clientX)/2,my=(e.touches[0].clientY+e.touches[1].clientY)/2;
      const wx=(mx-view.x)/view.s,wy=(my-view.y)/view.s;
      view.s=Math.min(4,Math.max(0.08,pinch.s*f));
      view.x=mx-wx*view.s;view.y=my-wy*view.s;draw();
    }else pinch={s:view.s,d};
  }
},{passive:false});
cv.addEventListener("touchend",()=>{pinch=null;});

// panel
const panel=document.getElementById("panel");
function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML;}
function select(h){
  sel=h;draw();
  const n=byH[h];if(!n)return;
  const food=document.getElementById("food");
  if(n.e[0]){food.src=n.e[0];food.style.display="block";}else food.style.display="none";
  document.getElementById("pfp").src=n.pfp||"";
  document.getElementById("pun").textContent="@"+(n.u||("fid "+n.fid));
  document.getElementById("pdn").textContent=n.dn&&n.dn!=="@"+n.u?n.dn:"";
  document.getElementById("ptxt").textContent=n.txt||"(media only)";
  const d=new Date(n.ts);
  const par=n.parent?byH[n.parent]:null;
  document.getElementById("pmet").innerHTML=(h===ROOT?"<span>🌱 root cast</span>":"<span>↳ quoted @"+esc(par?par.u:"?")+"</span>")+"<span>♥ "+(n.likes||0)+"</span><span>"+d.toLocaleDateString()+"</span>";
  const o=originOf(n);
  const po=document.getElementById("porigin");
  if(o&&h!==ROOT){po.style.display="block";po.innerHTML="🌍 Grew up: <b>"+esc(o.label)+"</b> <span style='color:#8b949e'>("+o.src+")</span> — guess before revealing!";}
  else po.style.display="none";
  document.getElementById("plink").href="https://farcaster.xyz/"+(n.u||"~/conversations")+"/0x"+n.h.replace(/^0x/,"").slice(0,10);
  panel.classList.add("open");
}
function close(){sel=null;panel.classList.remove("open");draw();}
document.getElementById("pclose").onclick=close;
document.getElementById("mode").onclick=function(){originMode=!originMode;this.classList.toggle("on",originMode);draw();};

// live data: public thread endpoint, direct first, then CORS proxies (all optional — snapshot is the fallback)
(async()=>{
  const badge=document.getElementById("live");
  const target="https://farcaster.xyz/~api/v2/user-thread-casts?castHashPrefix=0x3db99055&username=czar&limit=5";
  const attempts=[target,
    "https://api.allorigins.win/raw?url="+encodeURIComponent(target),
    "https://corsproxy.io/?"+encodeURIComponent(target)];
  let ok=false;
  for(const u of attempts){
    try{
      const r=await fetch(u,{signal:AbortSignal.timeout(7000)});
      if(!r.ok)throw 0;
      const j=await r.json();
      const rc=(j.result.casts||[]).find(c=>c.hash===ROOT);
      if(rc){
        const rn=byH[ROOT];
        if(rc.reactions&&rn)rn.likes=rc.reactions.count;
        ok=true;break;
      }
    }catch(e){}
  }
  if(ok){badge.textContent="LIVE · connected to Farcaster";badge.classList.add("live");draw();}
  else badge.textContent="SNAPSHOT · "+(DATA.harvestedAt||"").slice(0,10);
  const withOrigin=DATA.nodes.filter(originOf).length-1;
  document.getElementById("stats").textContent=DATA.count+" casts · "+(DATA.depth-1)+" quote levels · "+Math.max(0,withOrigin)+" origins tagged";
})();

// deep link
if(location.hash.length>4){const q=location.hash.slice(1);const hit=DATA.nodes.find(n=>n.h.startsWith(q));if(hit)select(hit.h);}
resize();fit();draw();
</script>
